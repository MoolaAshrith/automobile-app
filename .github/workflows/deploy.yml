   deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [manual-approval, terraform-apply, push-to-ecr]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/automobile-app-key.pem
          chmod 600 ~/.ssh/automobile-app-key.pem
          ssh-keyscan -H ${{ needs.terraform-apply.outputs.ec2_public_ip }} >> ~/.ssh/known_hosts

      - name: Wait for EC2 to be ready
        run: |
          echo "Waiting for EC2 SSH to be available..."
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/automobile-app-key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ubuntu@${{ needs.terraform-apply.outputs.ec2_public_ip }} \
              "echo ready" 2>/dev/null; then
              echo "EC2 is ready."
              exit 0
            fi
            echo "Attempt $i/20 — retrying in 15s..."
            sleep 15
          done
          echo "EC2 did not become ready in time."
          exit 1

      - name: Create app directory on EC2
        run: |
          ssh -i ~/.ssh/automobile-app-key.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ needs.terraform-apply.outputs.ec2_public_ip }} \
            "sudo mkdir -p /opt/automobile-app && sudo chown ubuntu:ubuntu /opt/automobile-app"

      - name: Copy docker-compose.prod.yml to EC2
        run: |
          scp -i ~/.ssh/automobile-app-key.pem \
            -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            ubuntu@${{ needs.terraform-apply.outputs.ec2_public_ip }}:/opt/automobile-app/docker-compose.yml

      - name: Deploy on EC2
        env:
          EC2_IP: ${{ needs.terraform-apply.outputs.ec2_public_ip }}
          ECR_IMAGE: ${{ needs.push-to-ecr.outputs.ecr_image }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ssh -i ~/.ssh/automobile-app-key.pem \
            -o StrictHostKeyChecking=no \
            ubuntu@${EC2_IP} << 'ENDSSH'
          set -e
          sudo mkdir -p /opt/automobile-app
          sudo chown ubuntu:ubuntu /opt/automobile-app
          cd /opt/automobile-app

          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com

          cat > .env << ENVEOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          FLASK_ENV=production
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=automobile-db
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          ECR_IMAGE=${ECR_IMAGE}
          ENVEOF

          docker pull ${ECR_IMAGE}
          docker compose down --remove-orphans || true
          docker compose up -d

          echo "Waiting for containers to be healthy..."
          for i in $(seq 1 18); do
            if docker compose ps | grep -q "Up"; then
              echo "Containers are up."
              break
            fi
            echo "Attempt $i/18 — waiting 10s..."
            sleep 10
          done
          docker compose ps
          echo "Deployment complete."

      - name: Smoke test
        env:
          EC2_IP: ${{ needs.terraform-apply.outputs.ec2_public_ip }}
        run: |
          echo "Running smoke test against http://${EC2_IP}/auth/login"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 10 \
              http://${EC2_IP}/auth/login)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed — HTTP ${STATUS}"
              exit 0
            fi
            echo "Attempt $i/12 — got HTTP ${STATUS}, retrying in 15s..."
            sleep 15
          done
          echo "Smoke test failed after 12 attempts."
          exit 1

      - name: Print deployment summary
        if: success()
        run: |
          echo "================================================"
          echo "  Deployment successful!"
          echo "  App URL : http://${{ needs.terraform-apply.outputs.ec2_public_ip }}"
          echo "  Image   : ${{ needs.push-to-ecr.outputs.ecr_image }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "================================================"
