  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [manual-approval, terraform-apply, push-to-ecr]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/automobile-app-key.pem
          chmod 600 ~/.ssh/automobile-app-key.pem
          ssh-keyscan -H ${{ needs.terraform-apply.outputs.ec2_public_ip }} >> ~/.ssh/known_hosts

      - name: Wait for EC2 to be ready
        run: |
          echo "Waiting for EC2 SSH to be available..."
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/automobile-app-key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ubuntu@${{ needs.terraform-apply.outputs.ec2_public_ip }} \
              "echo ready" 2>/dev/null; then
              echo "EC2 is ready."
              exit 0
            fi
            echo "Attempt $i/20 — retrying in 15s..."
            sleep 15
          done
